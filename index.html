<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Parity Ledger</title>
<style>
  :root {
    --bg: #ffffff;
    --card: #ffffff;
    --line: #c8d3df;
    --text: #14213d;
    --dim: #5d6d83;
    --accent: #1e3a5f;
    --win: #2d6e35;
    --loss: #8b3232;
    --tie: #8a6b1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 16px;
    max-width: 900px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  h1 {
    font-size: 22px;
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--accent);
  }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, button {
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 6px 10px;
    font: inherit;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  .updated { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  .day-header {
    margin: 20px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--accent);
    color: var(--accent);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-family: Georgia, "Times New Roman", serif;
  }
  .game {
    position: relative;
    background: #faf6ec;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    display: grid;
    grid-template-columns: 70px 1fr auto 1fr;
    align-items: center;
    gap: 10px;
  }
  .time { color: var(--dim); font-size: 13px; }
  .team { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .team.away { justify-content: flex-end; text-align: right; }
  .team img { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
  .team .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .name-stack { display: flex; flex-direction: column; min-width: 0; }
  .team.away .name-stack { align-items: flex-end; }
  .team-rec {
    font-size: 11px;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }
  .score {
    font-weight: 700;
    font-size: 16px;
    padding: 2px 10px;
    border-radius: 4px;
    background: var(--bg);
    border: 1px solid var(--line);
    white-space: nowrap;
  }
  .score.upcoming { color: var(--dim); font-weight: 500; font-size: 13px; }
  .winner { color: var(--win); }
  .loser { color: var(--dim); }
  .tier-dot {
    display: inline-block;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.15);
  }
  .tier-dot.red { background: #ef4444; border-color: rgba(0,0,0,0.2); }
  .tier-dot.white { background: #ffffff; border-color: #6d5e4a; }
  .tier-dot.blue { background: #3b82f6; border-color: rgba(0,0,0,0.2); }
  .tier-dot.green { background: #22c55e; border-color: rgba(0,0,0,0.2); }
  .info-btn {
    cursor: pointer;
    border: none;
    background: transparent;
    color: inherit;
    padding: 0;
    font-size: 11px;
    line-height: 1;
    opacity: 0.7;
  }
  .info-btn:hover { opacity: 1; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 4px; grid-column: 1 / -1; }
  .empty, .error {
    padding: 40px 20px;
    text-align: center;
    color: var(--dim);
  }
  .error { color: var(--loss); }
  .view-toggle {
    display: flex;
    gap: 0;
    margin: 4px 0 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    width: fit-content;
  }
  .view-toggle button {
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--dim);
    padding: 6px 14px;
  }
  .view-toggle button.active {
    background: var(--accent);
    color: #fffdf6;
    font-weight: 600;
  }
  table.standings {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
  }
  table.standings th, table.standings td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  table.standings th {
    color: var(--dim);
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--card);
  }
  table.standings th.sortable { cursor: pointer; user-select: none; }
  table.standings th.sortable:hover { color: var(--accent); }
  table.standings th .sort-arrow { opacity: 0.4; margin-left: 3px; font-size: 9px; }
  table.standings th.sort-active { color: var(--accent); }
  table.standings th.sort-active .sort-arrow { opacity: 1; }
  table.standings td.num, table.standings th.num { text-align: right; font-variant-numeric: tabular-nums; }
  table.standings tr:hover td { background: rgba(56,189,248,0.05); }
  .diff-pos { color: var(--win); }
  .diff-neg { color: var(--loss); }
  .magic-banner {
    background: #e8eef5;
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 10px 12px;
    margin: 8px 0 12px;
    font-size: 12px;
    color: var(--text);
    line-height: 1.5;
  }
  .magic-banner strong { color: var(--accent); font-family: Georgia, serif; }
  tr.tier-divider td {
    background: #dde6f1 !important;
    color: var(--accent);
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 6px 6px;
    border-top: 2px dashed var(--accent);
    border-bottom: 1px solid var(--line);
  }
  .move-up { color: var(--win); font-weight: 700; }
  .move-down { color: var(--loss); font-weight: 700; }
  .reason { display: block; color: var(--dim); font-size: 11px; margin-top: 3px; line-height: 1.4; }
  .reason-more { font-style: italic; opacity: 0.8; }
  .team-link { cursor: pointer; }
  .team-link:hover { color: var(--accent); text-decoration: underline; }
  .back-btn {
    margin: 0 0 12px;
    padding: 6px 12px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--accent);
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }
  .back-btn:hover { border-color: var(--accent); background: rgba(30,58,95,0.06); }
  .detail-header {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    margin: 8px 0 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: wrap;
  }
  .detail-rec {
    font-size: 14px;
    font-weight: 500;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-style: normal;
  }
  body.detail-mode header,
  body.detail-mode .view-toggle,
  body.detail-mode #updated { display: none; }
  footer {
    margin: 32px 0 8px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--dim);
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
  }
  footer a { color: var(--accent); }
  footer .motto {
    font-weight: 700;
    margin-top: 6px;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    letter-spacing: 0.5px;
  }
  .wax-seal {
    display: block;
    margin: 14px auto 0;
    width: 56px;
    height: auto;
    opacity: 0.9;
    transition: transform 0.4s ease, opacity 0.2s;
  }
  .wax-seal:hover { transform: rotate(-6deg) scale(1.05); opacity: 1; }
  /* Tooltip */
  .tip {
    position: fixed;
    background: var(--card);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    max-width: 240px;
    z-index: 100;
    box-shadow: 0 4px 12px rgba(74,30,46,0.18);
  }
  @media (max-width: 600px) {
    .game {
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto auto auto;
      gap: 4px 6px;
      padding: 8px;
    }
    .game .time {
      grid-column: 1 / -1;
      grid-row: 1;
      text-align: left;
      font-size: 12px;
      color: var(--accent);
      font-weight: 600;
    }
    .game .team.away { grid-column: 1; grid-row: 2; justify-content: flex-start; text-align: left; min-width: 0; }
    .game .team.away .name-stack { align-items: flex-start; }
    .game .team { min-width: 0; }
    .game .team .name { max-width: 100%; }
    .game .score { grid-column: 2; grid-row: 2; }
    .game .team:not(.away) { grid-column: 3; grid-row: 2; }
    .game .meta { grid-column: 1 / -1; grid-row: 3; }
    .team img { width: 20px; height: 20px; }
    .score { font-size: 14px; padding: 2px 6px; }
    h1 { font-size: 17px; }
  }
</style>
</head>
<body>
<header>
  <h1>Parity Ledger</h1>
  <div class="controls">
    <select id="year"></select>
    <select id="pool">
      <option value="all">All tiers</option>
      <option value="White">White</option>
      <option value="Blue">Blue</option>
      <option value="Red">Red</option>
      <option value="Green">Green</option>
    </select>
    <select id="team">
      <option value="all">All teams</option>
    </select>
    <button id="refresh">Refresh</button>
  </div>
</header>
<div class="view-toggle" role="tablist">
  <button id="view-results" class="active" role="tab">Results</button>
  <button id="view-summary" role="tab">Summary</button>
  <button id="view-magic" role="tab" style="display:none">🔮 Predict</button>
</div>
<div class="updated" id="updated"></div>
<div id="games"><div class="empty">Loading…</div></div>
<footer>
  <div>This is a hobby project. Check the <a href="https://www.elite9hockey.com/" target="_blank" rel="noopener">e9 schedule</a> for anything of consequence.</div>
  <div class="motto">Work Hard. Have Fun. Be Kind.</div>
  <img class="wax-seal" src="seal.png" alt="" aria-hidden="true">
</footer>

<script>
const ENDPOINT = "https://e9-proxy.lanavpetersson.workers.dev/";
const STORAGE_YEAR = "scoreboard:year";
const STORAGE_POOL = "scoreboard:pool";
const STORAGE_VIEW = "scoreboard:view";
const STORAGE_TEAM = "scoreboard:team";
const TIER_INFO = "Tier significance is unclear and could be meaningless.";

let currentView = localStorage.getItem(STORAGE_VIEW) || "results";
let summarySort = { key: "ranked", dir: "desc" };
let detailTeamId = null;
let detailReturn = null;

function showTeamDetail(teamId) {
  detailReturn = { scrollY: window.scrollY };
  detailTeamId = teamId;
  document.body.classList.add("detail-mode");
  render();
  window.scrollTo(0, 0);
}
function backFromDetail() {
  detailTeamId = null;
  document.body.classList.remove("detail-mode");
  render();
  if (detailReturn) {
    window.scrollTo(0, detailReturn.scrollY || 0);
    detailReturn = null;
  }
}
// Tier visibility is gated behind a URL param so the public link doesn't reveal it.
const showTiers = new URLSearchParams(location.search).has("tiers");

// Mock data for preview/local testing (when /api/games is unreachable).
const MOCK = {
  result: "success",
  lastUpdated: Date.now(),
  Games: { "Mock Program": { "Mock Team": [
    mockGame("2026-05-08","9:00 AM","Friday Rink","Wolves","Hawks","2016","2016 - Red","3-1","W"),
    mockGame("2026-05-08","11:00 AM","Friday Rink","Bruins","Eagles","2016","2016","2-2","T"),
    mockGame("2026-05-09","8:30 AM","Saturday Rink","Comets","Sharks","2016","2016 - Blue","",""),
    mockGame("2026-05-09","2:00 PM","Saturday Rink","Tigers","Otters","2016","2016 - White","",""),
    mockGame("2026-05-10","10:00 AM","Sunday Rink","Wolves","Comets","2016","2016 - Red","",""),
    mockGame("2026-05-08","9:00 AM","Friday Rink","Pumas","Lions","2017","2017 - Blue","1-4","L"),
    mockGame("2026-05-09","12:30 PM","Saturday Rink","Pumas","Bears","2017","2017","",""),
  ]}}
};
function mockGame(date,time,loc,a,b,group,div,score,wl){
  return {
    GameDate: date, StartTime: time, LocationName: loc,
    CurrTeamName: a, CurrTeamID: a, CurrLogo: "",
    OpponentName3: "vs " + b, OpponentTeamID: b, OpponentLogo: "",
    DivisionGroupName: group, DivisionName: div,
    GameScore: score, WinLoss: wl, LiveBarn: "",
  };
}

let allGames = [];
// Map of teamId -> tier label ("Red" | "White" | "Blue" | "Green" | "" if no tier)
let teamTiers = new Map();

// Shorten team display names. Examples:
//   "Boston Jr. Rangers 16 - Elite"   -> "E Rangers"
//   "EC Wizards 16 - Select 2"        -> "S2 Wizards"
//   "Worcester Jr. Railers - Select 2"-> "S2 Railers"
//   "Rangers 16 - E"                  -> "E Rangers"
//   "Winter Club 16 - S 2"            -> "S2 Winter Club"
function shortenTeamName(name) {
  if (!name) return "";
  let s = String(name).replace(/^(vs|at)\s+/i, "").trim();
  const m = s.match(/^(.+?)(?:\s+U?\d+)?(?:\s+-\s+(Elite|Select|E|S)(?:\s+(\d+))?)?\s*$/);
  if (!m) return s;
  let mascot = (m[1] || "").trim();
  const lvl = m[2] ? m[2].charAt(0).toUpperCase() : "";
  const num = m[3] || "";
  // Drop "Jr." / "Jr"
  mascot = mascot.replace(/\bJr\.?\b/gi, "").replace(/\s+/g, " ").trim();
  // Strip common city/state/program prefixes (peel off as many as match).
  const prefixes = ["Boston","Worcester","New Hampshire","NH","NE","EC","RI","VT","MA","Assabet","Junior","Westchester","Walpole"];
  let changed = true;
  while (changed && mascot) {
    changed = false;
    for (const p of prefixes) {
      const re = new RegExp("^" + p.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\s+", "i");
      if (re.test(mascot)) { mascot = mascot.replace(re, ""); changed = true; }
    }
  }
  if (!mascot) return s;
  return (lvl ? lvl + num + " " : "") + mascot;
}

function tierOf(divisionName) {
  if (!divisionName) return "";
  const idx = divisionName.indexOf(" - ");
  return idx === -1 ? "" : divisionName.slice(idx + 3);
}

function buildTeamTiers() {
  teamTiers = new Map();
  for (const g of allGames) {
    if (g.CurrTeamID && g.DivisionName) {
      teamTiers.set(g.CurrTeamID, tierOf(g.DivisionName));
    }
  }
}

// teamId -> "W-L-T" string (records this round, regardless of tier).
let teamRecords = new Map();
function buildTeamRecords() {
  const stats = new Map();
  for (const g of allGames) {
    if (!g.CurrTeamID) continue;
    if (!g.GameScore || !/\d+-\d+/.test(g.GameScore)) continue;
    if (!stats.has(g.CurrTeamID)) stats.set(g.CurrTeamID, { w: 0, l: 0, t: 0 });
    const s = stats.get(g.CurrTeamID);
    if (g.WinLoss === "W") s.w++;
    else if (g.WinLoss === "L") s.l++;
    else if (g.WinLoss === "T") s.t++;
  }
  teamRecords = new Map();
  for (const [id, s] of stats) {
    teamRecords.set(id, s.w + "-" + s.l + "-" + s.t);
  }
}

async function load() {
  const out = document.getElementById("games");
  out.innerHTML = '<div class="empty">Loading…</div>';
  let data, isMock = false;
  try {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 4000);
    const r = await fetch(ENDPOINT, { signal: ctl.signal });
    clearTimeout(timer);
    data = await r.json();
    if (data.error) throw new Error(data.error);
    if (data.result !== "success") throw new Error("API returned: " + data.result);
  } catch (e) {
    // Preview/local fallback: use mock data so the UI is testable without the proxy.
    data = MOCK;
    isMock = true;
  }
  allGames = flatten(data.Games);
  buildTeamTiers();
  buildTeamRecords();
  const stamp = data.lastUpdated
    ? new Date(data.lastUpdated).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : new Date().toLocaleTimeString();
  document.getElementById("updated").textContent =
    (isMock ? "PREVIEW (mock data) — " : "") + "Data last fetched: " + stamp;
  populateYearOptions();
  // Hide tier UI on the public URL.
  if (!showTiers) {
    document.getElementById("pool").style.display = "none";
    document.getElementById("pool").value = "all";
  }
  render();
}

function flatten(games) {
  const out = [];
  for (const prog of Object.values(games || {})) {
    for (const team of Object.values(prog)) {
      for (const g of team) out.push(g);
    }
  }
  return out;
}

// Derive a normalized "group" label from a game.
// Rules:
//   - 4-digit DivisionGroupName -> use as-is (e.g. "2016")
//   - DivisionName starts with "2019..." (or any 4-digit year) -> use that year
//   - DivisionName starts with "U8"  -> "2019"
//   - DivisionName starts with "U14" -> "U14"
//   - DivisionName starts with "U<n>" -> "U<n>" (keep the U-code as the group)
//   - Otherwise -> null (excluded from year filter)
function gameGroup(g) {
  const dgn = g.DivisionGroupName || "";
  if (/^\d{4}$/.test(dgn)) return dgn;
  const dn = g.DivisionName || "";
  const yearMatch = dn.match(/^(\d{4})/);
  if (yearMatch) return yearMatch[1];
  const uMatch = dn.match(/^U(\d+)/);
  if (uMatch) {
    if (uMatch[1] === "8") return "2019";
    return "U" + uMatch[1];
  }
  return null;
}

function populateYearOptions() {
  const groups = [...new Set(allGames.map(gameGroup).filter(Boolean))].sort();
  const sel = document.getElementById("year");
  const saved = localStorage.getItem(STORAGE_YEAR);
  sel.innerHTML = groups.map(y =>
    '<option value="' + y + '">' + y + '</option>'
  ).join("");
  if (saved && groups.includes(saved)) sel.value = saved;
  else if (groups.length) sel.value = groups[groups.length - 1];

  const poolSel = document.getElementById("pool");
  const savedPool = localStorage.getItem(STORAGE_POOL);
  if (savedPool && [...poolSel.options].some(o => o.value === savedPool)) {
    poolSel.value = savedPool;
  }
  populateTeamOptions();
}

function populateTeamOptions() {
  const year = document.getElementById("year").value;
  const pool = document.getElementById("pool").value;
  if (!year) return;
  let pool_games = allGames.filter(g => gameGroup(g) === year);
  if (pool !== "all") {
    pool_games = pool_games.filter(g => (g.DivisionName || "").endsWith(" - " + pool));
  }
  const teams = [...new Set(pool_games.map(g => g.CurrTeamName).filter(Boolean))].sort();
  const sel = document.getElementById("team");
  const saved = localStorage.getItem(STORAGE_TEAM) || "all";
  sel.innerHTML =
    '<option value="all">All teams</option>' +
    teams.map(t => '<option value="' + escapeHtml(t) + '">' + escapeHtml(t) + '</option>').join("");
  sel.value = teams.includes(saved) ? saved : "all";
}

function dedupe(games) {
  const seen = new Map();
  for (const g of games) {
    const a = g.CurrTeamID, b = g.OpponentTeamID;
    const key = g.GameDate + "|" + g.StartTime + "|" + [a,b].sort().join("-");
    const isHome = (g.OpponentName3 || "").includes("vs ");
    const existing = seen.get(key);
    if (!existing || (isHome && !existing._home)) {
      g._home = isHome;
      seen.set(key, g);
    }
  }
  return [...seen.values()];
}

function filteredGames({ applyTeam = false, crossTier = false } = {}) {
  const year = document.getElementById("year").value;
  const pool = document.getElementById("pool").value;
  const team = document.getElementById("team").value;
  if (!year) return { year: "", pool, team, games: [] };
  let games = allGames.filter(g => gameGroup(g) === year);
  if (pool !== "all") {
    if (crossTier) {
      // Include a game if EITHER team is in the selected tier.
      games = games.filter(g => {
        const curT = tierOf(g.DivisionName);
        const oppT = teamTiers.get(g.OpponentTeamID) || "";
        return curT === pool || oppT === pool;
      });
    } else {
      // Curr-team perspective only (used for standings — counts each tier's teams).
      games = games.filter(g => tierOf(g.DivisionName) === pool);
    }
  }
  if (applyTeam && team !== "all") {
    games = games.filter(g => g.CurrTeamName === team);
  }
  return { year, pool, team, games };
}

function render() {
  if (detailTeamId) return renderTeamDetail();
  if (currentView === "summary") return renderSummary();
  if (currentView === "magic") return renderMagic();
  return renderResults();
}

function renderTeamDetail() {
  const out = document.getElementById("games");
  const games = allGames.filter(g => g.CurrTeamID === detailTeamId);
  const teamName = games.length ? games[0].CurrTeamName : "Team";
  const tier = teamTiers.get(detailTeamId) || "";
  const tierDot = (showTiers && tier)
    ? '<span class="tier-dot ' + tier.toLowerCase() + '" style="margin:0 8px 0 0;vertical-align:middle"></span>'
    : '';
  const record = teamRecords.get(detailTeamId) || "";
  const sorted = games.slice().sort((a, b) => {
    if (a.GameDate !== b.GameDate) return a.GameDate.localeCompare(b.GameDate);
    return parseTime(a.StartTime) - parseTime(b.StartTime);
  });
  const byDay = {};
  for (const g of sorted) (byDay[g.GameDate] = byDay[g.GameDate] || []).push(g);
  const html = [];
  html.push('<button class="back-btn" id="back-btn">← Back</button>');
  html.push(
    '<div class="detail-header" title="' + escapeHtml(teamName) + '">' +
      tierDot + escapeHtml(shortenTeamName(teamName)) +
      (record ? ' <span class="detail-rec">' + escapeHtml(record) + '</span>' : "") +
    '</div>'
  );
  if (!sorted.length) {
    html.push('<div class="empty">No games for this team.</div>');
  } else {
    for (const date of Object.keys(byDay).sort()) {
      html.push('<div class="day-header">' + formatDate(date) + '</div>');
      for (const g of byDay[date]) html.push(gameCard(g, ""));
    }
  }
  out.innerHTML = html.join("");
  document.getElementById("back-btn").addEventListener("click", backFromDetail);
}

const TIER_ORDER = ["White", "Blue", "Red", "Green"];

// For a given team, examine their cross-tier results.
// Promotion signal = wins against any higher-tier opponent.
// Demotion signal = losses against any lower-tier opponent.
// Movement is capped to ±1 tier (White > Blue > Red > Green).
function analyzeTeamMovement(team) {
  const myTier = teamTiers.get(team.teamId) || "";
  const myRank = TIER_ORDER.indexOf(myTier);
  if (myRank === -1) return { currentTier: "", predicted: "", reasonGames: [], score: 0 };

  const wins_vs_higher = [];
  const losses_vs_lower = [];

  for (const g of allGames) {
    if (g.CurrTeamID !== team.teamId) continue;
    if (!g.GameScore || !/\d+-\d+/.test(g.GameScore)) continue;
    const oppTier = teamTiers.get(g.OpponentTeamID);
    if (!oppTier) continue;
    const oppRank = TIER_ORDER.indexOf(oppTier);
    if (oppRank < myRank && g.WinLoss === "W") {
      wins_vs_higher.push({ g, oppTier, oppRank });
    } else if (oppRank > myRank && g.WinLoss === "L") {
      losses_vs_lower.push({ g, oppTier, oppRank });
    }
  }

  const score = wins_vs_higher.length - losses_vs_lower.length;
  let predicted = myTier;
  let reasonGames = [];
  if (score >= 1 && myRank > 0) {
    predicted = TIER_ORDER[myRank - 1];
    // Most decisive promotion = win against highest tier (smallest oppRank)
    reasonGames = wins_vs_higher.slice().sort((a, b) => a.oppRank - b.oppRank);
  } else if (score <= -1 && myRank < TIER_ORDER.length - 1) {
    predicted = TIER_ORDER[myRank + 1];
    // Most decisive demotion = loss to lowest tier (largest oppRank)
    reasonGames = losses_vs_lower.slice().sort((a, b) => b.oppRank - a.oppRank);
  }
  return { currentTier: myTier, currentRank: myRank, predicted, predictedRank: TIER_ORDER.indexOf(predicted), reasonGames, score };
}

function renderMagic() {
  const year = document.getElementById("year").value;
  const out = document.getElementById("games");
  if (!year) {
    out.innerHTML = '<div class="empty">Select a birth year.</div>';
    return;
  }
  const yearGames = allGames.filter(g => gameGroup(g) === year && tierOf(g.DivisionName));
  const standings = computeStandings(yearGames);
  if (!standings.length) {
    out.innerHTML = '<div class="empty">No teams for this year.</div>';
    return;
  }

  const analyzed = standings.map(s => ({ ...s, ...analyzeTeamMovement(s) }));
  // How many teams currently sit in each tier (for the divider labels).
  const currentCounts = { White: 0, Blue: 0, Red: 0, Green: 0 };
  for (const t of analyzed) {
    if (t.currentTier in currentCounts) currentCounts[t.currentTier]++;
  }
  // Sort the list as a fluid continuum:
  //  Within each predicted tier, teams moving DOWN into it appear at the top
  //  (they came from a higher tier and are dropping just past the line),
  //  established teams in the middle (best→worst),
  //  teams moving UP into it appear at the bottom (rising up from below).
  // Primary order is predicted tier rank (White first).
  const movementGroup = (t) =>
    t.currentRank < t.predictedRank ? 0   // demoting in
    : t.currentRank === t.predictedRank ? 1 // staying
    : 2;                                  // promoting in
  analyzed.sort((a, b) =>
    a.predictedRank - b.predictedRank
    || movementGroup(a) - movementGroup(b)
    || b.points - a.points
    || b.diff - a.diff);

  const countsLine = TIER_ORDER
    .filter(t => currentCounts[t] > 0)
    .map(t => currentCounts[t] + " " + t)
    .join(" · ");
  const banner =
    '<div class="magic-banner">' +
      '<strong>🔮 Magic Ball — beta!</strong> ' +
      'Predictions look at cross-tier games only: each win vs a higher tier nudges a team up, each loss vs a lower tier nudges them down. ' +
      'Movement is capped at one tier (White ▸ Blue ▸ Red ▸ Green). ' +
      'Teams with no cross-tier surprises stay put. Reason shows the most decisive game.<br>' +
      '<em>Currently in this round: ' + countsLine + '. ' +
      'Note: a few teams (often guaranteed Whites) skip parity round 1 and won\'t appear here.</em>' +
    '</div>';

  const dot = (tier) => tier
    ? '<span class="tier-dot ' + tier.toLowerCase() + '" style="margin-right:6px;vertical-align:middle"></span>'
    : '';

  let lastPredicted = null;
  const rows = [];
  for (const t of analyzed) {
    if (t.predicted !== lastPredicted) {
      const cnt = currentCounts[t.predicted] || 0;
      rows.push(
        '<tr class="tier-divider"><td colspan="5">' +
          'Predicted ' + escapeHtml(t.predicted) +
          ' &middot; ' + cnt + ' currently in tier' +
        '</td></tr>'
      );
      lastPredicted = t.predicted;
    }

    let predictionCell = '<span style="color:var(--dim)">—</span>';
    if (t.predicted && t.predicted !== t.currentTier) {
      const up = t.predictedRank < t.currentRank;
      const arrow = up ? "↑" : "↓";
      const cls = up ? "move-up" : "move-down";
      const pick = t.reasonGames[0];
      let reason = "";
      if (pick) {
        const rawOpp = stripHtml(pick.g.OpponentName3).replace(/^(vs|at)\s+/, "");
        const oppName = escapeHtml(shortenTeamName(rawOpp));
        const verb = pick.g.WinLoss === "W" ? "Beat" : "Lost to";
        reason = '<span class="reason">' +
          verb + " " + escapeHtml(pick.oppTier) + " team " + oppName + " " + escapeHtml(pick.g.GameScore || "") +
          (t.reasonGames.length > 1 ? ' <span class="reason-more">+' + (t.reasonGames.length - 1) + ' more</span>' : "") +
        '</span>';
      }
      predictionCell =
        '<span class="' + cls + '">' + arrow + " " + dot(t.predicted) + escapeHtml(t.predicted) + '</span>' + reason;
    }

    const diffStr = (t.diff > 0 ? "+" : "") + t.diff;
    const diffCls = t.diff > 0 ? "diff-pos" : (t.diff < 0 ? "diff-neg" : "");

    rows.push(
      '<tr>' +
        '<td title="' + escapeHtml(t.name) + '">' + dot(t.currentTier) + escapeHtml(shortenTeamName(t.name)) + '</td>' +
        '<td class="num">' + t.completed + '/' + t.scheduled + '</td>' +
        '<td class="num">' + t.w + '-' + t.l + '-' + t.t + '</td>' +
        '<td class="num ' + diffCls + '">' + diffStr + '</td>' +
        '<td>' + predictionCell + '</td>' +
      '</tr>'
    );
  }

  out.innerHTML =
    banner +
    '<table class="standings">' +
      '<thead><tr>' +
        '<th>Team</th>' +
        '<th class="num">GP</th>' +
        '<th class="num">W-L-T</th>' +
        '<th class="num">Diff</th>' +
        '<th>Prediction</th>' +
      '</tr></thead>' +
      '<tbody>' + rows.join("") + '</tbody>' +
    '</table>';
}

function renderResults() {
  const { year, games: filtered } = filteredGames({ applyTeam: true, crossTier: true });
  if (!year) return;
  const games = dedupe(filtered).sort((a, b) => {
    if (a.GameDate !== b.GameDate) return a.GameDate.localeCompare(b.GameDate);
    return parseTime(a.StartTime) - parseTime(b.StartTime);
  });

  const out = document.getElementById("games");
  if (!games.length) {
    out.innerHTML = '<div class="empty">No games for this filter.</div>';
    return;
  }

  const byDay = {};
  for (const g of games) (byDay[g.GameDate] = byDay[g.GameDate] || []).push(g);

  const html = [];
  for (const date of Object.keys(byDay).sort()) {
    html.push('<div class="day-header">' + formatDate(date) + '</div>');
    for (const g of byDay[date]) html.push(gameCard(g, year));
  }
  out.innerHTML = html.join("");
}

function computeStandings(games) {
  const byTeam = new Map();
  for (const g of games) {
    const id = g.CurrTeamID;
    if (!id) continue;
    if (!byTeam.has(id)) {
      byTeam.set(id, {
        teamId: id, name: g.CurrTeamName || "(unknown)",
        scheduled: 0, completed: 0,
        w: 0, l: 0, t: 0, gf: 0, ga: 0,
      });
    }
    const s = byTeam.get(id);
    s.scheduled++;
    if (g.GameScore && /\d+-\d+/.test(g.GameScore)) {
      s.completed++;
      const [awayScore, homeScore] = g.GameScore.split("-").map(Number);
      const curIsHome = (g.OpponentName3 || "").includes("vs ");
      const curScore = curIsHome ? homeScore : awayScore;
      const oppScore = curIsHome ? awayScore : homeScore;
      s.gf += curScore;
      s.ga += oppScore;
      if (g.WinLoss === "W") s.w++;
      else if (g.WinLoss === "L") s.l++;
      else if (g.WinLoss === "T") s.t++;
    }
  }
  for (const s of byTeam.values()) {
    s.points = s.w * 2 + s.t;
    s.diff = s.gf - s.ga;
  }
  return [...byTeam.values()].sort((a, b) =>
    b.points - a.points
    || b.diff - a.diff
    || b.gf - a.gf
    || a.name.localeCompare(b.name));
}

// "Win-credit" — sum of opponents' points for games you won, half for ties.
// Beating a 6-point team is worth more than beating a 0-point team.
// Computed against the same year's full team pool (so cross-tier credits count).
function attachH2H(rows, year) {
  const yearGames = allGames.filter(g => gameGroup(g) === year);
  const allRows = computeStandings(yearGames);
  const pts = new Map();
  for (const r of allRows) pts.set(r.teamId, r.points);
  for (const r of rows) {
    let credit = 0;
    for (const g of yearGames) {
      if (g.CurrTeamID !== r.teamId) continue;
      if (!g.GameScore || !/\d+-\d+/.test(g.GameScore)) continue;
      const op = pts.get(g.OpponentTeamID) || 0;
      if (g.WinLoss === "W") credit += op;
      else if (g.WinLoss === "T") credit += op / 2;
    }
    r.h2h = credit;
  }
}

function sortStandings(rows, groupByTier) {
  const dir = summarySort.dir === "asc" ? 1 : -1;
  const k = summarySort.key;
  const tierRank = (r) => {
    const t = teamTiers.get(r.teamId) || "";
    const idx = TIER_ORDER.indexOf(t);
    return idx === -1 ? 99 : idx;
  };
  const cmpInner = (a, b) => {
    if (k === "name") return dir * a.name.localeCompare(b.name);
    if (k === "gp") return dir * (a.completed - b.completed) || a.name.localeCompare(b.name);
    if (k === "wlt") return dir * (a.points - b.points) || dir * (a.diff - b.diff) || a.name.localeCompare(b.name);
    if (k === "diff") return dir * (a.diff - b.diff) || a.name.localeCompare(b.name);
    if (k === "h2h") return dir * ((a.h2h || 0) - (b.h2h || 0)) || dir * (a.points - b.points) || a.name.localeCompare(b.name);
    // "ranked" default
    return b.points - a.points || b.diff - a.diff || b.gf - a.gf || a.name.localeCompare(b.name);
  };
  return rows.slice().sort((a, b) =>
    (groupByTier ? (tierRank(a) - tierRank(b)) : 0) || cmpInner(a, b));
}

function setSummarySort(key) {
  if (summarySort.key === key) {
    summarySort.dir = summarySort.dir === "desc" ? "asc" : "desc";
  } else {
    summarySort.key = key;
    summarySort.dir = key === "name" ? "asc" : "desc";
  }
  renderSummary();
}

function renderSummary() {
  const { year, games } = filteredGames();
  const out = document.getElementById("games");
  if (!year) {
    out.innerHTML = '<div class="empty">Select a birth year to see standings.</div>';
    return;
  }
  let rows = computeStandings(games);
  if (!rows.length) {
    out.innerHTML = '<div class="empty">No teams for this filter.</div>';
    return;
  }
  attachH2H(rows, year);
  const pool = document.getElementById("pool").value;
  const groupByTier = showTiers && pool === "all";
  rows = sortStandings(rows, groupByTier);
  let lastTier = null;
  const trsArr = [];
  for (const r of rows) {
    const tier = teamTiers.get(r.teamId) || "";
    if (groupByTier && tier !== lastTier) {
      trsArr.push('<tr class="tier-divider"><td colspan="5">' + escapeHtml(tier || "Unranked") + '</td></tr>');
      lastTier = tier;
    }
    const diffStr = (r.diff > 0 ? "+" : "") + r.diff;
    const diffCls = r.diff > 0 ? "diff-pos" : (r.diff < 0 ? "diff-neg" : "");
    const tierDot = (showTiers && tier)
      ? '<span class="tier-dot ' + tier.toLowerCase() + '" style="margin-right:6px;vertical-align:middle" title="' + escapeHtml(tier + ' — ' + TIER_INFO) + '"></span>'
      : '';
    trsArr.push(
      '<tr>' +
        '<td title="' + escapeHtml(r.name) + '">' + tierDot + escapeHtml(shortenTeamName(r.name)) + '</td>' +
        '<td class="num">' + r.completed + '/' + r.scheduled + '</td>' +
        '<td class="num">' + r.w + '-' + r.l + '-' + r.t + '</td>' +
        '<td class="num ' + diffCls + '">' + diffStr + '</td>' +
        '<td class="num">' + (r.h2h || 0) + '</td>' +
      '</tr>'
    );
  }
  const trs = trsArr.join("");
  const arrow = (key) => summarySort.key === key
    ? '<span class="sort-arrow">' + (summarySort.dir === "desc" ? "▼" : "▲") + '</span>'
    : '<span class="sort-arrow">↕</span>';
  const cls = (key) => 'sortable' + (summarySort.key === key ? ' sort-active' : '');
  out.innerHTML =
    '<table class="standings">' +
      '<thead><tr>' +
        '<th class="' + cls("name") + '" data-sort="name">Team' + arrow("name") + '</th>' +
        '<th class="num ' + cls("gp") + '" data-sort="gp">GP' + arrow("gp") + '</th>' +
        '<th class="num ' + cls("wlt") + '" data-sort="wlt">W-L-T' + arrow("wlt") + '</th>' +
        '<th class="num ' + cls("diff") + '" data-sort="diff">Diff' + arrow("diff") + '</th>' +
        '<th class="num ' + cls("h2h") + '" data-sort="h2h" title="Win-credit: sum of opponent points for games won (half for ties). Higher = beat stronger teams.">H2H' + arrow("h2h") + '</th>' +
      '</tr></thead>' +
      '<tbody>' + trs + '</tbody>' +
    '</table>';
  out.querySelectorAll("th[data-sort]").forEach(th =>
    th.addEventListener("click", () => setSummarySort(th.dataset.sort)));
}

function gameCard(g, year) {
  const curIsHome = (g.OpponentName3 || "").includes("vs ");
  const home = curIsHome
    ? { name: g.CurrTeamName, logo: g.CurrLogo }
    : { name: stripHtml(g.OpponentName3).replace(/^at\s+/, ""), logo: g.OpponentLogo };
  const away = curIsHome
    ? { name: stripHtml(g.OpponentName3).replace(/^vs\s+/, ""), logo: g.OpponentLogo }
    : { name: g.CurrTeamName, logo: g.CurrLogo };

  let scoreHtml, awayCls = "", homeCls = "";
  if (g.GameScore && /\d+-\d+/.test(g.GameScore)) {
    // GameScore format from upstream is "awayScore-homeScore".
    const [awayScore, homeScore] = g.GameScore.split("-").map(Number);
    if (homeScore > awayScore) { homeCls = "winner"; awayCls = "loser"; }
    else if (awayScore > homeScore) { awayCls = "winner"; homeCls = "loser"; }
    scoreHtml = '<div class="score"><span class="' + awayCls + '">' + awayScore + '</span> – <span class="' + homeCls + '">' + homeScore + '</span></div>';
  } else {
    scoreHtml = '<div class="score upcoming">vs</div>';
  }

  // Per-team tier dots: each team has its own tier (parity is cross-tier).
  const curTier = tierOf(g.DivisionName);
  const oppTier = teamTiers.get(g.OpponentTeamID) || "";
  const homeTier = curIsHome ? curTier : oppTier;
  const awayTier = curIsHome ? oppTier : curTier;
  const dot = (tier) => (showTiers && tier)
    ? '<span class="tier-dot ' + tier.toLowerCase() + '" title="' + escapeHtml(tier + ' — ' + TIER_INFO) + '"></span>'
    : '';

  // For upcoming games (no score), surface each team's running record.
  const isUpcoming = !(g.GameScore && /\d+-\d+/.test(g.GameScore));
  const homeId = curIsHome ? g.CurrTeamID : g.OpponentTeamID;
  const awayId = curIsHome ? g.OpponentTeamID : g.CurrTeamID;
  const homeRecStr = isUpcoming && teamRecords.get(homeId) ? teamRecords.get(homeId) : "";
  const awayRecStr = isUpcoming && teamRecords.get(awayId) ? teamRecords.get(awayId) : "";
  const recHtml = (r) => r
    ? '<span class="team-rec">' + escapeHtml(r) + '</span>'
    : '';

  return (
    '<div class="game">' +
      '<div class="time">' + g.StartTime + '</div>' +
      '<div class="team away">' +
        '<div class="name-stack">' +
          '<span class="name team-link ' + awayCls + '" data-team-id="' + escapeHtml(awayId || "") + '" title="' + escapeHtml(away.name) + '">' + escapeHtml(shortenTeamName(away.name)) + '</span>' +
          recHtml(awayRecStr) +
        '</div>' +
        dot(awayTier) +
        (away.logo ? '<img src="' + away.logo + '" alt="">' : '') +
      '</div>' +
      scoreHtml +
      '<div class="team">' +
        (home.logo ? '<img src="' + home.logo + '" alt="">' : '') +
        dot(homeTier) +
        '<div class="name-stack">' +
          '<span class="name team-link ' + homeCls + '" data-team-id="' + escapeHtml(homeId || "") + '" title="' + escapeHtml(home.name) + '">' + escapeHtml(shortenTeamName(home.name)) + '</span>' +
          recHtml(homeRecStr) +
        '</div>' +
      '</div>' +
      '<div class="meta">' + escapeHtml(g.LocationName || "") + '</div>' +
    '</div>'
  );
}

function parseTime(t) {
  const m = (t || "").match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return 0;
  let h = +m[1] % 12;
  if (m[3].toUpperCase() === "PM") h += 12;
  return h * 60 + +m[2];
}

function formatDate(iso) {
  const d = new Date(iso + "T12:00:00");
  return d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric", year: "numeric" });
}

function stripHtml(s) {
  const tmp = document.createElement("div");
  tmp.innerHTML = s || "";
  return tmp.textContent || "";
}

function escapeHtml(s) {
  return String(s || "").replace(/[&<>"']/g, c =>
    ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
}

// Tooltip handling for info icons
let activeTip = null;
function hideTip() {
  if (activeTip) { activeTip.remove(); activeTip = null; }
}
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".info-btn");
  hideTip();
  if (!btn) return;
  e.stopPropagation();
  const tip = document.createElement("div");
  tip.className = "tip";
  tip.textContent = btn.dataset.tip;
  document.body.appendChild(tip);
  const r = btn.getBoundingClientRect();
  tip.style.top = (r.bottom + 6) + "px";
  tip.style.left = Math.max(8, Math.min(window.innerWidth - 250, r.left - 100)) + "px";
  activeTip = tip;
});
window.addEventListener("scroll", hideTip, true);
window.addEventListener("resize", hideTip);

function setView(v) {
  currentView = v;
  localStorage.setItem(STORAGE_VIEW, v);
  document.getElementById("view-results").classList.toggle("active", v === "results");
  document.getElementById("view-summary").classList.toggle("active", v === "summary");
  document.getElementById("view-magic").classList.toggle("active", v === "magic");
  // Team filter only applies to Results view.
  document.getElementById("team").style.display = v === "results" ? "" : "none";
  // Tier filter is hidden in Magic Ball view (it considers all tiers).
  if (showTiers) {
    document.getElementById("pool").style.display = v === "magic" ? "none" : "";
  }
  render();
}
document.getElementById("view-results").addEventListener("click", () => setView("results"));
document.getElementById("view-summary").addEventListener("click", () => setView("summary"));
document.getElementById("view-magic").addEventListener("click", () => setView("magic"));
// Magic Ball view is private — only visible on the tiers-on URL.
if (showTiers) document.getElementById("view-magic").style.display = "";
// Persisted view may be invalid for current URL (e.g. magic on public link).
if (currentView === "magic" && !showTiers) currentView = "results";
setView(currentView);

document.getElementById("year").addEventListener("change", (e) => {
  localStorage.setItem(STORAGE_YEAR, e.target.value);
  populateTeamOptions();
  render();
});
document.getElementById("pool").addEventListener("change", (e) => {
  localStorage.setItem(STORAGE_POOL, e.target.value);
  populateTeamOptions();
  render();
});
document.getElementById("team").addEventListener("change", (e) => {
  localStorage.setItem(STORAGE_TEAM, e.target.value);
  render();
});
document.getElementById("refresh").addEventListener("click", load);
document.getElementById("games").addEventListener("click", (e) => {
  const el = e.target.closest(".team-link");
  if (el && el.dataset.teamId) showTeamDetail(el.dataset.teamId);
});
load();
